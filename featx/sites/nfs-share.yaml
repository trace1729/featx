# Example site profile "nfs-share" for shared storage and XiangShan/TraceRTL.
# Select it with `site: nfs-share` in $FEATX_ROOT/featx.yaml
# (`featx init` picks it on its own where the paths under `detect:` exist). Everything here can be
# overridden in that user layer; personal paths (git.repo, paths.dramsim3, ...) go there.

# `featx init` without --site selects this profile on a host where these exist.
detect: ['${share}/checkpoints_profiles']

# Prefer /nfs/share; use /nfs/home/share when a requested path is missing there.
# Set share_fallbacks: [] in the user layer to disable fallback.
share: /nfs/share
share_fallbacks: [/nfs/home/share]

hosts: [localhost]  # configure your task hosts in the user layer

paths:
  dramsim3: ${share}/ci-workloads/DRAMsim3
  gsim: ${share}/bin/gsim
  # nemu_diff is unset: exec runs diff against <git.repo>/ready-to-run/riscv64-nemu-interpreter-so,
  # the NEMU that matches your XiangShan checkout (set paths.nemu_diff to use another one).
  gcpt_restorer: ${share}/ci-workloads/old-gcpt-restorer/gcpt.bin
  # External executor entry point; override paths.perf_trigger for another checkout.
  perf_trigger: ${share}/ci-workloads/env-scripts/perf_trigger/main.py

checkpoints:
  roots:
    - ${share}/checkpoints_profiles
    - ${share}/checkpoints_profiles/legacy

default_workload: spec06

workloads:
  spec06:
    description: SPEC CPU2006, 55 benchmarks, 1090 SimPoints
    manifest: ${share}/${USER}/traces/nemu-trace-spec06-v1/_manifest.tsv
    label: spec06
    reference: null
    checkpoint: spec06_gcc15_rv64gcb_base_260122
    insts: ${share}/checkpoints_profiles/legacy/spec06_gcc15_rv64gcb_base_260122/checkpoint-0-0-0/cluster-0-0.json
    run:
      trace_root: ${share}/${USER}/traces/nemu-trace-spec06-v1
      # the manifest's checkpoint column points at a moved directory; legacy/ has them all
      checkpoint_file: ${share}/checkpoints_profiles/legacy/spec06_gcc15_rv64gcb_base_260122/checkpoint-0-0-0/${point.bench}/${point.cp}/_${point.cp}_${point.weight}_.zstd
  spec17:
    description: SPEC CPU2017, 31 benchmarks, 590 SimPoints
    manifest: ${share}/${USER}/traces/nemu-trace-spec17-v1/_manifest.tsv
    label: spec17
    reference: null
    checkpoint: spec17_rv64gcb_o2_20m
    # from legacy/spec17_rv64gcb_o2_20m logs/profiling "total guest instructions" + simpoint_summary.json
    insts: insts/spec17_rv64gcb_o2_20m.json
    run:
      trace_root: ${share}/${USER}/traces/nemu-trace-spec17-v1
      checkpoint_file: ${share}/checkpoints_profiles/legacy/spec17_rv64gcb_o2_20m/take_cpt/${point.name}/0/_${point.cp}_.gz
  spec26:
    description: SPEC CPU2026 (v1 traces), 1529 SimPoints
    manifest: ${share}/${USER}/traces/nemu-trace-spec26-v1/_manifest.tsv
    label: spec26
    reference: null
    checkpoint: spec26_gcc15_rv64gc_base_260517
    insts: ${share}/checkpoints_profiles/spec26_gcc15_rv64gc_base_260517/json/checkpoints_all.json
    run:
      trace_root: ${share}/${USER}/traces/nemu-trace-spec26-v1
      checkpoint_file: ${point.checkpoint}

# A run without run.workload: the spec06 traces / checkpoints (what featx always defaulted to).
recipe_defaults:
  run:
    trace_root: ${share}/${USER}/traces/nemu-trace-spec06-v1
    checkpoint_file: ${share}/checkpoints_profiles/legacy/spec06_gcc15_rv64gcb_base_260122/checkpoint-0-0-0/${point.bench}/${point.cp}/_${point.cp}_${point.weight}_.zstd
    perf_trigger:
      gcpt_path: ${share}/${USER}/traces/nemu-trace-spec06-v1

# Register your own references with featx baseline add, or in the user layer.
baselines: {}
