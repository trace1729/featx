# Built-in defaults. Override any key in $FEATX_ROOT/featx.yaml (deep-merged).
wt_root: /nfs/home/gongkaichen/tracertl/featx-wt
util_dir: /nfs/home/gongkaichen/tracertl/toolsets/util
analysis_dir: /nfs/home/gongkaichen/tracertl/toolsets/microarch/spec_trace_compare/03_analysis

git:
  repo: /nfs/home/gongkaichen/tracertl/OpenXiangshan-trace-verify-gsim
  base: main
  branch_prefix: ""        # node worktree branch = <prefix><node path>, e.g. wpe/overlay/smoke
  # Submodules that get their own worktree+branch (code changes land there);
  # every other submodule is shared via symlink (add-worktree-with-shared-submodules.sh).
  submodule_worktrees: [TraceRTL]

daemon:
  host: node024
  port: 8765
  bind: 0.0.0.0
  tick_seconds: 5

# Hosts featx may place jobs on. Empty = util/codex_dispatch.py DEFAULT_HOSTS.
hosts: []
exclude_hosts: []

placement:
  probe_ttl: 60            # seconds a host probe stays valid
  probe_timeout: 4
  reserve_cores: 4         # never fill a host's last N cores
  max_jobs_per_host: 96    # featx's own concurrent jobs per host
  mem_reserve_gb: 32
  max_launches_per_tick: 128   # ssh launches per scheduler tick (the rest go next tick; 0 = no cap)
  max_total_cores: 300     # remote run cores; FIFO within runs (0 = no cap)
  max_build_cores: 64      # independent remote build budget; FIFO within builds (0 = no cap)

liveness:
  heartbeat_interval: 30
  dead_after: 180          # heartbeat unchanged this long (daemon clock) + no exit_code = dead
  launch_grace: 120        # a job that never wrote fx/start within this window = launch failure

retry:
  max_infra_attempts: 3
  max_design_relaunches: 3

# run.workload names. manifest: TSV with benchmark/point/weight/checkpoint/trace columns
# (the point list and ${point.checkpoint} / ${point.trace}); run: keys layered under every run
# recipe; label: the post plugins' `suite`; reference: their default baseline (null = none,
# post steps that compare must set with.reference); insts: per-benchmark instruction counts
# {bench: {insts, points}} for spec-score (relative paths are under featx/defaults/).
# Add a workload in $FEATX_ROOT/featx.yaml.
workloads:
  spec06:
    description: SPEC CPU2006, 55 benchmarks, 1090 SimPoints
    manifest: /nfs/share/gkc/traces/nemu-trace-spec06-v1/_manifest.tsv
    label: spec06
    reference: exec-0903
    insts: /nfs/home/share/checkpoints_profiles/legacy/spec06_gcc15_rv64gcb_base_260122/checkpoint-0-0-0/cluster-0-0.json
    run:
      trace_root: /nfs/share/gkc/traces/nemu-trace-spec06-v1
      # the manifest's checkpoint column points at a moved directory; legacy/ has them all
      checkpoint_file: /nfs/home/share/checkpoints_profiles/legacy/spec06_gcc15_rv64gcb_base_260122/checkpoint-0-0-0/${point.bench}/${point.cp}/_${point.cp}_${point.weight}_.zstd
  spec17:
    description: SPEC CPU2017, 31 benchmarks, 590 SimPoints
    manifest: /nfs/share/gkc/traces/nemu-trace-spec17-v1/_manifest.tsv
    label: spec17
    reference: exec-0903-spec17
    # from legacy/spec17_rv64gcb_o2_20m logs/profiling "total guest instructions" + simpoint_summary.json
    insts: insts/spec17_rv64gcb_o2_20m.json
    run:
      trace_root: /nfs/share/gkc/traces/nemu-trace-spec17-v1
      checkpoint_file: /nfs/home/share/checkpoints_profiles/legacy/spec17_rv64gcb_o2_20m/take_cpt/${point.name}/0/_${point.cp}_.gz
  spec26:
    description: SPEC CPU2026 (v1 traces), 1529 SimPoints
    manifest: /nfs/share/gkc/traces/nemu-trace-spec26-v1/_manifest.tsv
    label: spec26
    reference: null
    insts: /nfs/home/share/checkpoints_profiles/spec26_gcc15_rv64gc_base_260517/json/checkpoints_all.json
    run:
      trace_root: /nfs/share/gkc/traces/nemu-trace-spec26-v1
      checkpoint_file: ${point.checkpoint}
