# Built-in defaults: only values that hold on any machine. Shared, cluster-wide values come
# from a site profile (`site:`, featx/sites/<name>.yaml), personal ones from the user layer
# $FEATX_ROOT/featx.yaml (`featx init` writes it; deep-merged, later wins).
# ${root} = the data root, ${home} = your home dir.

# Site profile: a name under featx/sites/ (e.g. nfs-share) or a path to a YAML file.
site: null

wt_root: ${root}/worktrees     # node worktrees go to <wt_root>/<node path>
# Dir of the spec_trace_compare analysis scripts (collect_gsim_spec_perf.py, ...). The collect /
# pair / diagnose / branch-mpki post plugins need it; null disables them.
analysis_dir: null

# Tools and checkouts that recipes and plugins use as ${paths.<name>} (null = unset).
paths:
  gsim: gsim               # gsim binary (build tool: gsim); a bare name is looked up in PATH
  verilator_bin: null      # dir prepended to PATH for tool: verilator (null = PATH as is)
  dramsim3: null           # DRAMsim3 checkout with build/ (WITH_DRAMSIM3 builds and their runs)
  nemu_diff: null          # exec mode: --diff reference .so (null = --no-diff)
  gcpt_restorer: null      # exec mode: -r restorer for .gz checkpoints
  perf_trigger: null       # run executor perf_trigger: its main.py
  xiangshan: null          # XiangShan checkout with scripts/top-down (pair, diagnose); null = git.repo

git:
  repo: null               # the XiangShan repo node worktrees are created from (required for worktrees)
  base: main
  branch_prefix: ""        # node worktree branch = <prefix><node path>, e.g. wpe/overlay/smoke
  # Submodules that get their own worktree+branch (code changes land there);
  # every other submodule is shared via symlink (featx/bin/add-worktree.sh).
  submodule_worktrees: [TraceRTL]

daemon:
  host: null               # where `featx daemon start` runs featxd (null = this host)
  port: 8765
  bind: 0.0.0.0
  tick_seconds: 5

# Hosts featx may place jobs on (passwordless ssh, same paths everywhere); [localhost] runs here.
hosts: [localhost]
exclude_hosts: []

placement:
  probe_ttl: 60            # seconds a host probe stays valid
  probe_timeout: 4
  reserve_cores: 4         # never fill a host's last N cores
  max_jobs_per_host: 96    # featx's own concurrent jobs per host
  mem_reserve_gb: 32
  max_launches_per_tick: 128   # ssh launches per scheduler tick (the rest go next tick; 0 = no cap)
  max_total_cores: 300     # remote run cores; FIFO within runs (0 = no cap)
  max_build_cores: 64      # independent remote build budget; FIFO within builds (0 = no cap)

liveness:
  heartbeat_interval: 30
  dead_after: 180          # heartbeat unchanged this long (daemon clock) + no exit_code = dead
  launch_grace: 120        # a job that never wrote fx/start within this window = launch failure

retry:
  max_infra_attempts: 3
  max_design_relaunches: 3

# run.workload names. manifest: TSV with benchmark/point/weight/checkpoint/trace columns
# (the point list and ${point.checkpoint} / ${point.trace}); run: keys layered under every run
# recipe; label: the post plugins' `suite`; reference: their default baseline (null = none,
# post steps that compare must set with.reference); insts: per-benchmark instruction counts
# {bench: {insts, points}} for spec-score (relative paths are under featx/defaults/);
# checkpoint: the checkpoint set (featx ckpt list) the workload's traces were made from.
workloads: {}
# The workload a run without run.workload is labelled / scored / compared as (post plugins).
default_workload: null

# Checkpoint sets for exec runs (run.checkpoint): dirs whose sub-dirs spec<NN>* are sets.
checkpoints:
  roots: []

# Named result roots seeded into $FEATX_ROOT/baselines.yaml ({name: {root, description, ...}}).
baselines: {}

# Recipe keys layered right above the package recipe defaults ({build: {...}, run: {...}}).
recipe_defaults: {}
