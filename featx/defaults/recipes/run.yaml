# Run recipe defaults. executor: points (featx places every point) | perf_trigger
executor: points
# mode: trace | exec. Unset = the build's mode (same submit, or the --bin runset's build);
# trace when neither is known.
mode: null
# workload: a featx.yaml `workloads` name (spec06, spec17, spec26). Its run keys
# (trace_root, checkpoint_file) sit below every recipe layer; with no points / points_file /
# suite the run takes all of its points (`benchmarks` narrows them).
workload: null
emu: ${bin}                 # runset binary (build task output); or an absolute path
W: 20000000
I: 40000000
args: ""                    # extra emu arguments
env: {}                     # exported before the emu (e.g. TRACERTL_WP_MEM: future)
trace_root: /nfs/share/gkc/traces/nemu-trace-spec06-v1
trace_file: ${trace_root}/${point.bench}/${point.cp}/_${point.cp}_${point.weight}_.trace.zstd
# exec mode: the checkpoint image of a point (${point.checkpoint} = the workload manifest's)
checkpoint_file: /nfs/home/share/checkpoints_profiles/legacy/spec06_gcc15_rv64gcb_base_260122/checkpoint-0-0-0/${point.bench}/${point.cp}/_${point.cp}_${point.weight}_.zstd
exec:
  diff: /nfs/share/gkc/wpe-synthetic_PA/0903/bin/riscv64-nemu-interpreter-so   # --diff <so>; null = --no-diff
  gcpt_restorer: /nfs/home/share/ci-workloads/old-gcpt-restorer/gcpt.bin      # -r, for .gz images
dramsim3_home: /nfs/home/gongkaichen/tracertl/DRAMsim3
# Points: explicit names <bench>_<cp>_<weight>, a file with one per line, and/or a suite
# (their union); with a workload and none of them, all of the workload's points.
points: []
points_file: null
suite: null                 # {config: <spec json>, benchmarks: [optional subset]}
benchmarks: []              # keep only points of these benchmarks
dump_db: false              # --dump-db --db-path=<point dir>/chiseldb.sqlite (needs build.options.chiseldb)
cores_per_point: null       # null = the build's options.threads (1 without a build)
mem_gb_per_point: 8
timeout_hours: 72
completion_marker: true     # rc 0 without a marker -> append "EXCEEDING CYCLE/INSTR LIMIT" (collector needs it)
command: null               # a custom command line; null = commands[mode]
commands:
  trace: >-
    ${emu} --no-diff --tracertl-file ${trace_file} -W ${W} -I ${I}
    --dramsim3-outdir "$FX_TMP/dramsim3" --force-dump-result ${db_args} ${args}
  exec: >-
    ${emu} -i ${checkpoint_file} ${diff_args} ${restorer_args} -W ${W} -I ${I}
    --dramsim3-outdir "$FX_TMP/dramsim3" --force-dump-result ${db_args} ${args}
# executor: perf_trigger
perf_trigger:
  main: /nfs/share/gkc/wpe-WrongPathEmu-nogenpaddr-after-anchor/1010/perf_trigger/main.py
  gcpt_path: /nfs/share/gkc/traces/nemu-trace-spec06-v1
  json_path: null
  emu_wrapper: null
  servers: null             # comma list; null = featx picks the least-loaded hosts
  n_servers: 6
  threads: 1
